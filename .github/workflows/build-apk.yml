name: Build MAGNET APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project archive
        run: |
          for f in *.zip; do
            [ -f "$f" ] && unzip -o "$f"
          done
          if [ -d "MAGNET" ] && [ -f "MAGNET/package.json" ]; then
            cp -r MAGNET/. .
          fi
          ls -la package.json capacitor.config.ts vite.mobile.config.ts

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install dependencies and build mobile bundle
        run: |
          npm install
          npm run build:mobile
          npx cap add android || true
          npx cap sync android

      - name: Set landscape orientation and build APK
        run: |
          node -e '
            const fs = require("fs");
            const p = "android/app/src/main/AndroidManifest.xml";
            let xml = fs.readFileSync(p, "utf8");
            if (!xml.includes("android:screenOrientation")) {
              xml = xml.replace("<activity", "<activity android:screenOrientation=\"landscape\"");
              fs.writeFileSync(p, xml);
            }
          '
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: MAGNET-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

